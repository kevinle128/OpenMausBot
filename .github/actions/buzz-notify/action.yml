name: Buzz notify
description: Joins the tailnet and posts one event to the Buzz App callback. Fails unless the relay answers 202.

inputs:
  event_type:
    description: Event name, for example release.published.
    required: true
  content:
    description: Message body.
    required: true
  idempotency_key:
    description: Unique key for this event. Use the run id, the run attempt and the event name.
    required: true
  repository_name:
    description: Buzz project route name. Set exactly one of repository_name and channel_name.
    required: false
    default: ""
  channel_name:
    description: Buzz channel name to post to directly (pass the BUZZ_CHANNEL_NAME variable). Set exactly one of repository_name and channel_name.
    required: false
    default: ""
  callback_url:
    description: Buzz App callback URL (pass the BUZZ_APP_CALLBACK_URL secret).
    required: true
  app_secret:
    description: Buzz App webhook secret (pass the BUZZ_APP_SECRET secret).
    required: true
  ts_oauth_client_id:
    description: Tailscale OAuth client id (pass the TS_OAUTH_CLIENT_ID secret).
    required: true
  ts_oauth_secret:
    description: Tailscale OAuth client secret (pass the TS_OAUTH_SECRET secret).
    required: true

runs:
  using: composite
  steps:
    # The relay is reachable only inside the tailnet.
    - name: Join tailnet
      uses: ./.github/actions/join-tailnet
      with:
        ts_oauth_client_id: ${{ inputs.ts_oauth_client_id }}
        ts_oauth_secret: ${{ inputs.ts_oauth_secret }}

    - name: Post to Buzz
      shell: bash
      env:
        BUZZ_APP_CALLBACK_URL: ${{ inputs.callback_url }}
        BUZZ_APP_SECRET: ${{ inputs.app_secret }}
        EVENT_TYPE: ${{ inputs.event_type }}
        CONTENT: ${{ inputs.content }}
        IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        REPOSITORY_NAME: ${{ inputs.repository_name }}
        CHANNEL_NAME: ${{ inputs.channel_name }}
      run: |
        set -euo pipefail
        if [[ -n "$REPOSITORY_NAME" && -n "$CHANNEL_NAME" ]] || [[ -z "$REPOSITORY_NAME" && -z "$CHANNEL_NAME" ]]; then
          echo "::error::Set exactly one of repository_name and channel_name"
          exit 1
        fi
        body="$(mktemp)"
        response="$(mktemp)"
        trap 'rm -f "$body" "$response"' EXIT
        jq -n \
          --arg idempotency_key "$IDEMPOTENCY_KEY" \
          --arg repository_name "$REPOSITORY_NAME" \
          --arg channel_name "$CHANNEL_NAME" \
          --arg event_type "$EVENT_TYPE" \
          --arg content "$CONTENT" \
          '{idempotency_key: $idempotency_key, event_type: $event_type, content: $content}
            + (if $channel_name != "" then {channel_name: $channel_name} else {repository_name: $repository_name} end)' > "$body"
        status="$(curl -sS -o "$response" -w '%{http_code}' -X POST "$BUZZ_APP_CALLBACK_URL" \
          -H "X-Webhook-Secret: $BUZZ_APP_SECRET" \
          -H 'Content-Type: application/json' \
          --data @"$body")"
        if [[ "$status" != "202" ]]; then
          echo "::error::Buzz callback answered HTTP ${status} for ${EVENT_TYPE}, expected 202"
          head -c 500 "$response" || true
          echo
          exit 1
        fi
        echo "Buzz accepted ${EVENT_TYPE} (HTTP 202)"
